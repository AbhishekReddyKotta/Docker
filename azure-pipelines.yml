# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: mynew-pool

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- task: CmdLine@2
  inputs:
    script: 'docker build -t shaikmustafa/azurerepo:v2 .'

- task: Docker@2
  inputs:
    containerRegistry: 'mydockerhub-connection'
    repository: 'shaikmustafa/azurerepo'
    command: 'push'
    tags: 'v2'

